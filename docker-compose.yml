version: '3'
services:
  autoheal:
    restart: always
    image: willfarrell/autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  api_server:
    env_file: .env
    build: .
    environment:
      TZ: Europe/Moscow
    command: sh -c "pnpm start"
    ports:
      - '6101:4040'
    restart: unless-stopped
    healthcheck:
      test: wget -S -O- http://api_server:4040/health-api/health || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m
    depends_on:
      - autoheal

  reduce_prover:
    env_file: .env
    build: .
    environment:
      TZ: Europe/Moscow
    command: sh -c "pnpm start-rp"
    restart: unless-stopped
    healthcheck:
      test: wget -S -O- http://reduce_prover:4042/health-api/health || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m
    depends_on:
      - autoheal

  buy_server:
    ports:
      - '4049:4049'
    env_file: .env
    build: .
    environment:
      TZ: Europe/Moscow
    command: sh -c "pnpm start-buy-server"
    restart: unless-stopped
    healthcheck:
      test: wget -S -O- http://buy_server:4049/health-api/health || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m
    depends_on:
      - autoheal

  second_party:
    env_file: .env.second-party
    build: .
    environment:
      TZ: Europe/Moscow
    command: sh -c "pnpm start-second-party"
    restart: unless-stopped
    healthcheck:
      test: wget -S -O- http://second_party:4044/health-api/health || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10m
    depends_on:
      - autoheal

  staketab_proxy_api:
    ports:
      - '4043:4043'
    env_file: .env
    build: .
    environment:
      TZ: Europe/Moscow
    command: sh -c "pnpm start-staketab-proxy"
    restart: unless-stopped
    depends_on:
      - autoheal
